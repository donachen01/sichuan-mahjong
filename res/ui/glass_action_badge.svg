<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62bdf5" stop-opacity="0.80"/>
      <stop offset="0.56" stop-color="#258ee4" stop-opacity="0.84"/>
      <stop offset="0.86" stop-color="#177bd7" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#32e6f8" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="lowerBloom" cx="70%" cy="82%" r="64%">
      <stop offset="0" stop-color="#89ffff" stop-opacity="0.24"/>
      <stop offset="0.36" stop-color="#39efff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2ddfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#e9fdff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="256" cy="256" r="207"/></clipPath>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- True soft bloom rendered to PNG for the Godot runtime. -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#38edff" stroke-width="22" stroke-opacity="0.66" filter="url(#outerGlow)"/>
  <circle cx="256" cy="256" r="219" fill="none" stroke="#72f7ff" stroke-width="12" stroke-opacity="0.72" filter="url(#edgeGlow)"/>

  <!-- Exact concentric geometry: thin outer lens, bright main edge, cyan inner edge. -->
  <circle cx="256" cy="256" r="238" fill="#d7f4ff" fill-opacity="0.025" stroke="#ffffff" stroke-width="4" stroke-opacity="0.88"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="1"/>
  <circle cx="256" cy="256" r="207" fill="url(#glass)" stroke="#9bfbff" stroke-width="6" stroke-opacity="0.98"/>
  <circle cx="256" cy="256" r="203" fill="url(#lowerBloom)"/>

  <!-- Restrained diagonal glass reflection; no solid smile-shaped arc. -->
  <g clip-path="url(#lensClip)">
    <path d="M48 12 L154 0 L455 512 L326 512 Z" fill="url(#sheen)"/>
    <path d="M111 175 A171 171 0 0 1 260 90" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.32"/>
  </g>
</svg>
